            <div class="mv{{#si alta}} mv--alta{{/si}}" data-mv data-dura="{{dura}}">
{{#no @primero}}              <template data-mv-guardada>
{{/no}}              <div class="mv__escena" aria-hidden="true">
                <div class="mv__hilo">
{{#cada pasos}}                  <div class="mv__paso" data-en="{{en}}"{{#si hasta}} data-hasta="{{hasta}}"{{/si}}><div class="mv__cabe">
{{#si pastilla}}                    <p class="mv__hora"><svg focusable="false"><use href="#i-luna"/></svg>{{pastilla.texto}}</p>
{{/si}}{{#si etiqueta}}                    <p class="mv__etiqueta">{{etiqueta.texto}}</p>
{{/si}}{{#si base}}                    <div class="mv__base"><p class="mv__base-titulo"><svg focusable="false"><use href="#i-libreta"/></svg><span class="mv__base-nombre">{{base.titulo}}<small class="mv__base-de">{{base.detalle}}</small></span></p><ul role="list">{{#cada base.renglones}}<li><span>{{nombre}}</span><b>{{valor}}</b></li>{{/cada}}</ul></div>
{{/si}}{{#si sale}}                    <p class="wa__m wa__m--sale">{{#si sale.foto}}<img class="mv__foto" src="{{armado.recursos}}{{sale.foto.archivo}}" alt="" width="{{sale.foto.ancho}}" height="{{sale.foto.alto}}" loading="lazy" decoding="async">{{/si}}{{sale.texto}}{{#si sale.hora}}<span class="wa__hora">{{sale.hora}} <svg class="wa__tics" focusable="false"><use href="#i-tics"/></svg></span>{{/si}}</p>
{{/si}}{{#si voz}}                    <p class="wa__m wa__m--sale wa__m--voz"><span class="wa__voz"><span class="wa__voz-foto"><b>{{voz.inicial}}</b><svg viewBox="0 0 16 16" focusable="false"><path d="M8 1.5a2.2 2.2 0 0 0-2.2 2.2v4a2.2 2.2 0 0 0 4.4 0v-4A2.2 2.2 0 0 0 8 1.5zM4 7.5a4 4 0 0 0 3.4 4v2h1.2v-2a4 4 0 0 0 3.4-4h-1.2a2.8 2.8 0 0 1-5.6 0z"/></svg></span><svg class="wa__voz-toca" focusable="false"><use href="#i-reproducir"/></svg><span class="wa__onda"><svg viewBox="0 0 117.6 26" preserveAspectRatio="none" focusable="false"><path d="M1.3 11.3v3.4M5.9 9.3v7.4M10.5 6.3v13.4M15.1 9.8v6.4M19.7 4.3v17.4M24.3 2.3v21.4M28.9 7.3v11.4M33.5 10.3v5.4M38.1 5.3v15.4M42.7 3.3v19.4M47.3 8.3v9.4M51.9 11.3v3.4M56.5 6.8v12.4M61.1 3.8v18.4M65.7 8.8v8.4M70.3 10.8v4.4M74.9 5.8v14.4M79.5 2.8v20.4M84.1 7.8v10.4M88.7 9.8v6.4M93.3 4.8v16.4M97.9 9.3v7.4M102.5 11.3v3.4M107.1 7.3v11.4M111.7 10.3v5.4M116.3 11.8v2.4"/></svg><svg class="wa__onda-oida" viewBox="0 0 117.6 26" preserveAspectRatio="none" focusable="false"><path d="M1.3 11.3v3.4M5.9 9.3v7.4M10.5 6.3v13.4M15.1 9.8v6.4M19.7 4.3v17.4M24.3 2.3v21.4M28.9 7.3v11.4M33.5 10.3v5.4M38.1 5.3v15.4M42.7 3.3v19.4M47.3 8.3v9.4M51.9 11.3v3.4M56.5 6.8v12.4M61.1 3.8v18.4M65.7 8.8v8.4M70.3 10.8v4.4M74.9 5.8v14.4M79.5 2.8v20.4M84.1 7.8v10.4M88.7 9.8v6.4M93.3 4.8v16.4M97.9 9.3v7.4M102.5 11.3v3.4M107.1 7.3v11.4M111.7 10.3v5.4M116.3 11.8v2.4"/></svg></span><span class="wa__voz-pie"><span>{{voz.dura}}</span><span class="wa__hora">{{voz.hora}} <svg class="wa__tics" focusable="false"><use href="#i-tics"/></svg></span></span></span></p>
{{/si}}{{#si entra}}                    <p class="wa__m wa__m--entra">{{#si entra.liga}}<span class="wa__liga"><span class="wa__liga-signo">$</span><span class="wa__liga-texto"><b class="wa__liga-titulo">{{entra.liga.titulo}}</b><span class="wa__liga-monto">{{entra.liga.monto}}</span><small class="wa__liga-sitio">{{entra.liga.sitio}}</small></span></span>{{/si}}{{entra.texto}}{{#si entra.hora}}<span class="wa__hora">{{entra.hora}}</span>{{/si}}</p>
{{/si}}{{#si agenda}}                    <div class="mv__agenda"{{#si agenda.cambia}} data-cambia="{{agenda.cambia}}"{{/si}}><p class="mv__rotulo">{{agenda.rotulo}}</p><ul role="list">{{#cada agenda.renglones}}<li{{#si ocupado}} data-ocupado{{/si}}{{#si luego}} data-nueva{{/si}}>{{hora}} · <span class="mv__estado"><span class="mv__antes">{{estado}}</span>{{#si luego}}<b class="mv__luego">{{luego}}</b>{{/si}}</span>{{#si luego}}{{> sello}}{{/si}}</li>{{/cada}}</ul></div>
{{/si}}{{#si aprobado}}                    <p class="mv__aprobado"><i><svg focusable="false"><use href="#i-palomita"/></svg></i>{{aprobado.texto}}</p>
{{/si}}{{#si cita}}                    <p class="minicita"><span class="minicita__dia"><small>{{cita.dia}}</small><b>{{cita.fecha}}</b></span><span class="minicita__texto"><b>{{cita.hora}}</b><span>{{cita.detalle}}</span></span>{{> sello}}</p>
{{/si}}{{#si hizo}}                    <p class="mv__hizo{{#si hizo.grande}} mv__hizo--grande{{/si}}"><i><svg focusable="false"><use href="#i-palomita"/></svg></i>{{hizo.texto}}</p>
{{/si}}{{#si recado}}                    <div class="mv__recado"><p class="mv__rotulo">{{recado.rotulo}}</p><p class="mv__recado-texto">{{recado.texto}}</p></div>
{{/si}}{{#si examen}}                    <p class="mv__examen"><span>{{examen.nombre}}</span><i class="mv__raya"><i></i></i><b class="mv__bien"><svg focusable="false"><use href="#i-palomita"/></svg></b></p>
{{/si}}                  </div></div>
{{/cada}}                </div>
              </div>
{{#no @primero}}              </template>
{{/no}}            </div>
